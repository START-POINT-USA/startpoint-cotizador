<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#050D22; --navy-mid:#09193D; --navy-line:#233457;
    --gold:#D00000; --gold-soft:#F27A7A; --cream:#FFFFFF;
    --slate:#9FB4C9; --slate-dim:#5A6E88; --good:#C5D6DD;
    --red:#D00000; --red-dark:#960000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #0f2650 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #0c1f45 0%, transparent 55%),
      var(--navy-deep);
    color:var(--cream); font-family:'Inter',sans-serif; min-height:100vh; padding:44px 20px 110px;
  }
  .wrap{max-width:1000px;margin:0 auto; position:relative; padding-top:130px;}
  .logo-corner{
    position:absolute; top:0; right:0; height:150px; width:auto; border-radius:6px;
  }
  @media(max-width:600px){
    .wrap{padding-top:0;}
    .logo-corner{ position:static; display:block; margin:0 0 20px; height:120px; }
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold-soft); margin-bottom:14px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--gold-soft);display:inline-block;}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,4vw,42px); line-height:1.08; margin:0 0 12px; letter-spacing:-.01em;}
  h1 em{font-style:italic; color:var(--gold);}
  .sub{color:var(--slate); font-size:15px; max-width:660px; line-height:1.6;}

  /* ---- COMMON MODULE ---- */
  .common-box{
    margin-top:30px; background:linear-gradient(155deg,#0f2650,#081530);
    border:1px solid var(--navy-line); border-radius:12px; padding:20px 24px;
    display:flex; align-items:center; gap:18px; cursor:pointer; transition:.2s;
  }
  .common-box:hover{border-color:var(--slate-dim);}
  .common-box.checked{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 8px 24px -10px rgba(208,0,0,.35);}
  .common-box .box{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--navy-line); flex-shrink:0;
    background:var(--navy-deep); display:flex;align-items:center;justify-content:center; font-size:13px;
  }
  .common-box.checked .box{background:var(--gold); border-color:var(--gold); color:var(--navy-deep);}
  .common-box.checked .box::after{content:"✓";}
  .common-box .ctxt{flex:1;}
  .common-box .clabel{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--gold-soft); margin-bottom:4px;
  }
  .common-box .cname{font-family:'Fraunces',serif; font-size:18px; font-weight:500; margin-bottom:3px;}
  .common-box .cnote{font-size:13px; color:var(--slate); line-height:1.5;}
  .common-box .cprice{font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--gold); white-space:nowrap;}
  .meetings-note{
    margin-top:8px; font-size:12.5px; color:var(--slate); padding:0 4px; line-height:1.5;
  }
  .meetings-note b{color:var(--gold-soft);}

  /* ---- STEP LABELS ---- */
  .step-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--slate-dim); margin:38px 0 16px; display:flex; align-items:center; gap:12px;
  }
  .step-label .n{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--gold); color:var(--gold);
    display:flex;align-items:center;justify-content:center; font-size:11px; flex-shrink:0;
  }
  .step-label .line{flex:1;height:1px;background:linear-gradient(90deg,var(--navy-line),transparent);}

  /* ---- PATH BUTTONS ---- */
  .paths{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media(max-width:760px){.paths{grid-template-columns:1fr;}}
  .path-card{
    background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:10px;
    padding:22px 20px; cursor:pointer; transition:.2s; position:relative;
  }
  .path-card:hover{border-color:var(--slate-dim);}
  .path-card.active{
    border-color:var(--gold); background:linear-gradient(155deg,#0f2650,#081530);
    box-shadow:0 0 0 1px var(--gold) inset, 0 8px 24px -8px rgba(208,0,0,.3);
  }
  .path-card .tag{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--slate-dim); text-transform:uppercase;}
  .path-card.active .tag{color:var(--gold-soft);}
  .path-card h3{font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin:8px 0 6px; color:var(--cream);}
  .path-card p{font-size:13px; color:var(--slate); line-height:1.5; margin:0;}
  .path-check{position:absolute; top:16px; right:16px; width:18px; height:18px; border-radius:50%; border:1px solid var(--navy-line); display:flex; align-items:center; justify-content:center; transition:background-color .2s, border-color .2s;}
  .path-card.active .path-check{background:var(--gold); border-color:var(--gold);}
  .path-card.active .path-check::after{content:"✓"; font-size:11px; color:#fff; font-weight:700;}

  .sub-toggle{margin-top:14px; display:none; gap:8px;}
  .sub-toggle.show{display:flex;}
  .sub-toggle button{
    flex:1; background:var(--navy-deep); border:1px solid var(--navy-line); color:var(--slate);
    font-family:'Inter'; font-size:12.5px; padding:9px 6px; border-radius:6px; cursor:pointer;
  }
  .sub-toggle button.active{border-color:var(--gold); color:var(--gold-soft); background:#0f2650;}

  /* ---- STAGE TABS ---- */
  .tabs{display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .tab{
    background:transparent; border:1px solid var(--navy-line); color:var(--slate);
    font-family:'Inter'; font-weight:500; font-size:13.5px; padding:10px 18px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .tab.active{background:var(--gold); color:var(--navy-deep); border-color:var(--gold); font-weight:600;}
  .tab .num{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.7; margin-right:6px;}

  /* ---- PANEL ---- */
  .panel{margin-top:22px; background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:12px; padding:30px 30px 24px;}
  @media(max-width:600px){.panel{padding:22px 18px;}}
  .panel-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .panel-head h2{font-family:'Fraunces',serif; font-size:24px; font-weight:500; margin:0 0 6px;}
  .panel-head .goal{color:var(--slate); font-size:13.5px; max-width:480px; line-height:1.5;}
  .price-box{text-align:right;}
  .price-box .lbl{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--slate-dim); letter-spacing:.1em; text-transform:uppercase;}
  .price-box .val{font-family:'Fraunces',serif; font-size:30px; color:var(--gold); font-weight:500; white-space:nowrap;}

  .group-title{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--slate-dim); margin:22px 0 10px; padding-top:16px; border-top:1px solid var(--navy-line);
  }
  .group-title:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .group-title .flag{color:var(--good); margin-left:8px; text-transform:none; letter-spacing:0;}

  .item{display:flex; align-items:flex-start; gap:12px; padding:10px 0; font-size:14px;}
  .item .box{
    width:18px;height:18px;border-radius:5px;border:1px solid var(--navy-line); flex-shrink:0; margin-top:1px;
    display:flex;align-items:center;justify-content:center; font-size:11px; color:transparent;
  }
  .item.core .box{background:var(--slate-dim); border-color:var(--slate-dim); color:var(--navy-deep);}
  .fixed-legend{
    display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--slate);
    margin:0 0 16px; line-height:1.5;
  }
  .fixed-legend-box{
    width:14px; height:14px; border-radius:4px; background:var(--slate-dim); flex-shrink:0; margin-top:2px;
  }
  .item.core .box::after{content:"✓";}
  .item.opt{cursor:pointer;}
  .item.opt .box{background:var(--navy-deep);}
  .item.opt.checked .box{background:var(--gold); border-color:var(--gold); color:var(--navy-deep);}
  .item.opt.checked .box::after{content:"✓";}
  .item .txt{flex:1;}
  .item .name{color:var(--cream); font-weight:500;}
  .item .note{color:var(--slate); font-size:12.5px; margin-top:2px; line-height:1.45;}
  .item .price{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--slate); white-space:nowrap; margin-left:8px;}
  .item.opt.checked .price{color:var(--gold-soft);}
  .item.core .price{color:var(--slate-dim);}
  .fixed-note{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--slate-dim); letter-spacing:.06em; text-transform:uppercase; margin:-4px 0 4px 30px;}

  .nexo-tag{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.04em; color:var(--red); background:rgba(208,0,0,.12);
    border:1px solid rgba(208,0,0,.4); border-radius:5px; padding:2px 7px; margin-top:6px;
  }

  /* ---- TOTAL BAR ---- */
  .totalbar{
    margin-top:26px; background:var(--navy-deep); border:1px solid var(--navy-line); border-radius:12px;
    padding:20px 26px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  .totalbar .left{font-size:13px; color:var(--slate);}
  .totalbar .left b{
    font-family:'Fraunces',serif; font-size:19px; font-weight:500; color:var(--cream);
  }
  .totalbar .right{text-align:right;}
  .totalbar .right .lbl{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--slate-dim); text-transform:uppercase;}
  .totalbar .right .val{font-family:'Fraunces',serif; font-size:26px; color:var(--gold); font-weight:500;}

  /* ---- INTRO SCREEN (nombre y apellido) ---- */
  .intro-box{
    margin-top:22px; background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:12px;
    padding:32px 28px; max-width:480px;
  }
  .intro-title{font-family:'Fraunces',serif; font-size:22px; font-weight:500; margin-bottom:6px;}
  .intro-sub{color:var(--slate); font-size:13.5px; margin-bottom:20px; line-height:1.5;}
  .intro-fields{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .intro-input{
    flex:1; min-width:160px; background:var(--navy-deep); border:1px solid var(--navy-line); color:var(--cream);
    font-family:'Inter'; font-size:14px; padding:12px 14px; border-radius:8px;
  }
  .intro-input::placeholder{color:var(--slate-dim);}
  .intro-input:focus{outline:none; border-color:var(--gold);}
  .intro-btn{
    background:var(--gold); color:#fff; border:none; font-family:'Inter'; font-weight:700; font-size:14.5px;
    padding:13px 24px; border-radius:10px; cursor:pointer; transition:.15s;
  }
  .intro-btn:hover{background:var(--red-dark);}

  /* ---- CLIENT SUBMIT BOX ---- */
  .submit-box{
    margin-top:26px; background:linear-gradient(155deg,#0f2650,#081530); border:1px solid var(--gold);
    border-radius:12px; padding:22px 26px; display:flex; flex-direction:column; gap:16px;
  }
  .submit-txt{width:100%;}
  .submit-title{font-family:'Fraunces',serif; font-size:17px; font-weight:500;}
  .submit-sub{color:var(--slate); font-size:12.5px; margin-top:3px;}
  .notes-label{display:block; font-family:'Inter'; font-weight:600; font-size:13px; color:var(--cream); margin-top:14px;}

  /* ---- FORMA DE PAGO ---- */
  .payment-options{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:640px){.payment-options{grid-template-columns:1fr;}}
  .payment-card{
    background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:12px;
    padding:20px 22px; cursor:pointer; transition:.2s; position:relative;
  }
  .payment-card:hover{border-color:var(--slate-dim);}
  .payment-card.active{
    border-color:var(--gold); background:linear-gradient(155deg,#1a3050,#132a45);
    box-shadow:0 0 0 1px var(--gold) inset, 0 8px 24px -8px rgba(208,0,0,.3);
  }
  .payment-card .ptag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate-dim);
  }
  .payment-card.active .ptag{color:var(--gold-soft);}
  .payment-card h4{font-family:'Fraunces',serif; font-size:17px; font-weight:500; margin:6px 0 8px; color:var(--cream);}
  .payment-card .pval{font-family:'Fraunces',serif; font-size:22px; color:var(--gold); font-weight:500;}
  .payment-card .pnote{font-size:12px; color:var(--slate); margin-top:6px; line-height:1.5;}
  .payment-card .pcheck{
    position:absolute; top:16px; right:16px; width:18px; height:18px; border-radius:50%;
    border:1px solid var(--navy-line); display:flex; align-items:center; justify-content:center;
  }
  .payment-card.active .pcheck{background:var(--gold); border-color:var(--gold);}
  .payment-card.active .pcheck::after{content:"✓"; font-size:11px; color:#fff; font-weight:700;}

  .disclaimer-box{
    margin-top:14px; font-size:11px; color:var(--slate-dim); line-height:1.6;
    background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:10px; padding:14px 16px;
  }
  .disclaimer-box b{color:var(--slate);}
  .notes-input{
    width:100%; margin-top:6px; background:var(--navy-deep); border:1px solid var(--navy-line); color:var(--cream);
    font-family:'Inter'; font-size:13.5px; padding:12px 14px; border-radius:8px; resize:vertical; min-height:70px;
  }
  .notes-input::placeholder{color:var(--slate-dim);}
  .notes-input:focus{outline:none; border-color:var(--gold);}
  .submit-btn{
    align-self:flex-end;
    background:var(--gold); color:#fff; border:none; font-family:'Inter'; font-weight:700; font-size:14.5px;
    padding:14px 22px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:.15s;
    box-shadow:0 8px 20px -8px rgba(208,0,0,.5);
  }
  .submit-btn:hover{background:var(--red-dark); transform:translateY(-1px);}

  footer{margin-top:38px; text-align:center; color:var(--slate-dim); font-size:12px;}

  .admin-gear{
    background:none; border:none; cursor:pointer;
    margin-left:10px; opacity:.65; transition:.2s; vertical-align:middle;
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; padding:0;
  }
  .admin-gear svg{width:15px; height:15px; stroke:var(--slate-dim);}
  .admin-gear:hover{opacity:1;}
  .admin-gear:hover svg{stroke:var(--cream);}

  /* ---- WIZARD SCREENS ---- */
  .screen{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* red boxed back button, linktree-style */
  .back-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--red); border:none;
    color:#fff; font-family:'Inter'; font-weight:700; font-size:14px; padding:12px 22px 12px 16px;
    border-radius:12px; cursor:pointer; margin-bottom:20px; box-shadow:0 6px 18px -6px rgba(208,0,0,.5);
    transition:.15s;
  }
  .back-btn:hover{background:var(--red-dark); transform:translateX(-2px);}
  .back-btn .arrow{font-size:20px; line-height:1;}

  .path-pill{
    display:inline-flex; align-items:center; gap:8px; background:var(--navy-mid); border:1px solid var(--gold);
    border-radius:999px; padding:8px 16px; margin:0 0 8px 12px; font-size:13px; color:var(--gold-soft);
  }
  .path-pill b{color:var(--cream); font-weight:600;}
  .stage-head-row{display:flex; align-items:center; flex-wrap:wrap;}

  /* ---- SHARE BUTTON + MODAL ---- */
  .share-fab{
    position:fixed; right:24px; bottom:24px; z-index:40;
    display:none; align-items:center; gap:9px; background:var(--red); color:#fff; border:none;
    font-family:'Inter'; font-weight:700; font-size:14px; padding:14px 22px; border-radius:999px;
    cursor:pointer; box-shadow:0 10px 26px -8px rgba(208,0,0,.55); transition:.15s;
  }
  .share-fab:hover{background:var(--red-dark); transform:translateY(-2px);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,12,22,.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:80; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:14px;
    padding:28px; max-width:420px; width:100%;
  }
  .modal-box h3{font-family:'Fraunces',serif; font-size:20px; margin:0 0 6px; font-weight:500;}
  .modal-box p{font-size:13px; color:var(--slate); margin:0 0 18px; line-height:1.5;}
  .share-opt{
    display:flex; align-items:center; gap:12px; width:100%; background:var(--navy-deep);
    border:1px solid var(--navy-line); color:var(--cream); font-family:'Inter'; font-size:14px; font-weight:500;
    padding:13px 16px; border-radius:10px; cursor:pointer; margin-bottom:10px; transition:.15s;
  }
  .share-opt:hover{border-color:var(--gold);}
  .share-opt .ic{font-size:17px;}
  .modal-close{
    margin-top:8px; background:none; border:none; color:var(--slate-dim); font-family:'Inter';
    font-size:13px; cursor:pointer; width:100%; padding:8px;
  }

  /* ---- ADMIN SCREEN ---- */
  .admin-overlay{
    position:fixed; inset:0; background:var(--navy-deep); z-index:100; overflow-y:auto;
    display:none; padding:40px 20px 80px;
  }
  .admin-overlay.show{display:block;}
  .admin-wrap{max-width:760px; margin:0 auto;}
  .admin-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .admin-head h2{font-family:'Fraunces',serif; font-size:26px; margin:0; font-weight:500;}
  .admin-close{background:var(--navy-mid); border:1px solid var(--navy-line); color:var(--cream); font-family:'Inter'; font-size:13px; padding:9px 16px; border-radius:8px; cursor:pointer;}
  .admin-sub{color:var(--slate); font-size:13px; margin-bottom:24px;}
  .admin-group{margin-top:26px;}
  .admin-group h4{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--gold-soft); border-bottom:1px solid var(--navy-line); padding-bottom:8px; margin-bottom:10px;
  }
  .admin-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0; font-size:13.5px; border-bottom:1px solid rgba(36,64,95,.4);}
  .admin-row .lbl{color:var(--cream); flex:1;}
  .admin-row input{
    width:110px; background:var(--navy-mid); border:1px solid var(--navy-line); color:var(--gold-soft);
    font-family:'IBM Plex Mono',monospace; font-size:13px; padding:7px 10px; border-radius:6px; text-align:right;
  }
  .admin-actions{display:flex; gap:10px; margin-top:30px; flex-wrap:wrap;}
  .admin-btn{
    font-family:'Inter'; font-weight:600; font-size:13.5px; padding:11px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--navy-line);
  }
  .admin-btn.primary{background:var(--gold); color:var(--navy-deep); border-color:var(--gold);}
  .admin-btn.ghost{background:none; color:var(--slate);}
  .admin-io{margin-top:26px;}
  .admin-io textarea{
    width:100%; height:110px; background:var(--navy-mid); border:1px solid var(--navy-line); color:var(--cream);
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; border-radius:8px; padding:12px; resize:vertical;
  }
  .admin-status{font-size:12px; color:var(--good); margin-top:8px; min-height:16px;}
  .submissions-list{max-height:320px; overflow-y:auto;}
  .submission-row{
    background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:8px;
    padding:12px 14px; margin-bottom:8px; font-size:12.5px;
  }
  .submission-row .srow-top{display:flex; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .submission-row .sname{color:var(--cream); font-weight:600;}
  .submission-row .stotal{color:var(--gold); font-family:'IBM Plex Mono',monospace;}
  .submission-row .smeta{color:var(--slate-dim); font-size:11px;}
  .submissions-empty{color:var(--slate-dim); font-size:12.5px; padding:8px 0;}

  .langbar{position:absolute; top:0; left:0; display:flex; gap:4px;}
  .langbar button{background:var(--navy-mid); border:1px solid var(--navy-line); color:var(--slate); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer;}
  .langbar button.on{background:var(--red); border-color:var(--red); color:#fff;}
  @media(max-width:600px){.langbar{position:static; margin:0 0 14px;}}
  .stage-title{font-family:'Fraunces',serif; font-size:20px; margin:26px 0 2px; color:var(--cream);}
  .stage-title:first-child{margin-top:0;}
  .item .tick{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate-dim); white-space:nowrap; margin-left:8px;}
  .done-box{margin-top:26px; background:var(--navy-mid); border:1px solid var(--navy-line); border-radius:12px; padding:28px; text-align:center; display:none;}
  .done-box h3{font-family:'Fraunces',serif; font-size:24px; margin:0 0 8px; font-weight:500;}
  .done-box p{color:var(--slate); margin:0; font-size:14px; line-height:1.6;}
</style>
</head>

  common:{n:X('Formación legal‑administrativa','Legal and administrative formation'), d:X('LLC / C‑Corp + EIN + Registered Agent + apertura de cuenta bancaria + Agreement','LLC / C‑Corp + EIN + Registered Agent + bank account opening + Agreement')},
  diag:{n:X('Diagnóstico y estrategia inicial','Initial diagnosis and strategy')},
  coord:{n:X('Coordinación logística con abogado de inmigración y contacto continuo en todas las etapas contratadas','Logistics coordination with your immigration attorney and continuous contact throughout all contracted stages')},
  ideacion:{n:X('Sesión de ideación + research de industrias/estados afines','Ideation session + research of related industries/states')},
  duediligence:{n:X('Análisis preliminar del negocio elegido (hasta tres negocios)','Preliminary analysis of the chosen business (up to three businesses)')},
  matchingcon:{n:X('Matching de franquicias + revisión preliminar de 2‑3 FDD + vinculación preferencial con gestor','Franchise matching + preliminary review of 2–3 FDDs + preferred connection with a broker')},
  local:{n:X('Búsqueda de local','Location search'), d:X('Relevamiento y preselección de ubicaciones','Survey and shortlisting of locations')},
  compra:{n:X('Compra de negocio existente','Purchase of an existing business'), d:X('Due diligence completa, negociación, transición de management','Full due diligence, negotiation, management transition')},
  franquiciasetup:{n:X('Franquicia — cierre de selección (si aplica)','Franchise — selection close (if applicable)'), d:X('Conexión con franquiciante, setup según manual de marca','Connection with the franchisor, setup per brand manual')},
  lease:{n:X('Negociación de lease','Lease negotiation'), d:X('Acompañamiento en términos y firma de contrato','Support with terms and contract signing')},
  permisos:{n:X('Permisos y licencias iniciales','Initial permits and licenses'), d:X('Gestión de permisos municipales/estatales según industria','Municipal/state permits depending on industry')},
  revenue:{n:X('Inscripción ante Revenue estatal','State Revenue registration'), d:X('Registro impositivo estatal (sales tax / withholding)','State tax registration (sales tax / withholding)')},
  seguros:{n:X('Seguros de negocio','Business insurance'), d:X('Cobertura general liability y coberturas iniciales según rubro','General liability and initial coverage depending on your industry'), nexo:1},
  buildout:{n:X('Buildout básico','Basic buildout'), d:X('Adecuación inicial del espacio. No incluye obras, refacciones, tendidos de redes o eléctricos, ni permisos de construcción (se pueden tramitar aparte si son necesarios, fuera de este presupuesto). Sí incluye recepción e instalación de escritorios, mesas, sillas, computadoras e impresoras, con coordinación previa de entrega.','Initial adaptation of the space. Does not include construction, renovations, network or electrical wiring, or building permits (these can be handled separately if needed, outside this quote). It does include receiving and installing desks, tables, chairs, computers and printers, with prior delivery coordination.'), nexo:1},
  compliance:{n:X('Compliance básico (licencias locales/estatales)','Basic compliance (local/state licenses)')},
  digital:{n:X('Presencia digital inicial','Initial digital presence'), d:X('Web + redes sociales básicas','Website + basic social media')},
  contrat:{n:X('Apoyo en contratación inicial','Initial hiring support'), d:X('Según cantidad de posiciones','Depending on the number of positions'), nexo:1},
  traduccion:{n:X('Traducción / legalización de documentos','Document translation / legalization')},
  carpeta:{n:X('Armado de carpeta de evidencia operativa para abogado migratorio','Operating evidence folder for your immigration attorney')},
  soporte:{n:X('Soporte operativo 30‑60‑90 días','Operational support 30‑60‑90 days'), d:X('Día 30: acompañamos el arranque — revisamos que los procesos estén en marcha y te ayudamos a detectar errores de gestión, si los hay (la apertura y venta del negocio dependen del cliente, no de Start Point). Día 60: chequeamos que contabilidad y nómina corran sin errores, y ajustamos lo que haga falta. Día 90: cerramos con un balance del trimestre y KPIs armados. Incluido siempre — no es un ítem a elegir.','Day 30: we support the launch — we check that processes are running and help you spot management errors, if any (opening and selling the business depend on the client, not on Start Point). Day 60: we check that accounting and payroll run without errors and adjust what is needed. Day 90: we close with a quarterly review and KPIs in place. Always included — not an item to choose.')},
  conta:{n:X('Setup sistema contable QuickBooks','QuickBooks accounting system setup'), d:X('Start Point arma y gestiona tu sistema contable a través de nuestro equipo contable — Toro Taxes / FP Only Solutions (más migración de datos si es negocio en marcha).','Start Point sets up and manages your accounting system through our accounting team — Toro Taxes / FP Only Solutions (plus data migration if it is an existing business).')},
  nomina:{n:X('Setup de nómina (payroll)','Payroll setup'), d:X('Incluido durante los primeros 90 días. Start Point gestiona tu nómina de principio a fin, a través de nuestro equipo contable — Toro Taxes / FP Only Solutions (incluye Quarterly Taxes, Sales Tax & Forms).','Included during the first 90 days. Start Point manages your payroll from start to finish through our accounting team — Toro Taxes / FP Only Solutions (includes Quarterly Taxes, Sales Tax & Forms).')},
  retainer:{n:X('Continuidad mensual (Retainer)','Monthly continuity (Retainer)'), d:X('Si quieres seguir con nosotros después de los 90 días: contabilidad, nómina y control mensual continuo (incluye Quarterly Taxes, Sales Tax & Forms).','If you want to keep working with us after the 90 days: accounting, payroll and ongoing monthly control (includes Quarterly Taxes, Sales Tax & Forms).')},
};
const LAUNCH_COMMON = ['lease','permisos','revenue','seguros','buildout','compliance','digital','contrat','traduccion','carpeta'];
const STARTER_ADDON = {emprendedor:'ideacion', marcha:'duediligence', franquicia:'matchingcon'};
const LAUNCH_FIRST = {emprendedor:'local', marcha:'compra', franquicia:'franquiciasetup'};

// ================= ESTADO =================
const params = new URLSearchParams(location.search);
const LEAD_ID = (params.get('id') || '').slice(0, 40);
let L = (params.get('idioma') || (navigator.language||'es')).toLowerCase().startsWith('en') ? 'en' : 'es';
const st = { path:null, owns:'con', common:false, sel:{}, payment:null };
const $ = id => document.getElementById(id);
const t = o => o[L];

function setText(id, o, html){ $(id)[html?'innerHTML':'textContent'] = t(o); }
function applyStatic(){
  document.documentElement.lang = L;
  setText('tEyebrow',UI.eyebrow); setText('tH1',UI.h1,1); setText('tSub',UI.sub);
  setText('tStepData',UI.stepData); $('fn').placeholder=t(UI.fn); $('ln').placeholder=t(UI.ln); $('em').placeholder=t(UI.em);
  setText('tCommonLabel',UI.commonLabel); setText('tCommonName',IT.common.n); setText('tCommonNote',IT.common.d);
  setText('tStepPath',UI.stepPath); setText('tOwnsCon',UI.ownsCon); setText('tOwnsSin',UI.ownsSin);
  setText('tStepServices',UI.stepServices); setText('tLegend',UI.legend);
  setText('tStepPay',UI.stepPay); setText('tPaySub',UI.paySub); setText('tDisclaimer',UI.disclaimer,1);
  setText('tSubmitTitle',UI.submitTitle); setText('tSubmitSub',UI.submitSub);
  setText('tNotesLabel',UI.notesLabel); $('clientNotes').placeholder=t(UI.notesPh);
  if(!$('clientSubmitBtn').disabled) $('clientSubmitBtn').textContent=t(UI.send);
  setText('tDoneH',UI.doneH); setText('tDoneP',UI.doneP); setText('tFooter',UI.footer);
  $('langES').classList.toggle('on',L==='es'); $('langEN').classList.toggle('on',L==='en');
}

// ================= RENDER =================
function renderPaths(){
  const el=$('paths'); el.innerHTML='';
  PATHS.forEach(p=>{
    const c=document.createElement('div');
    c.className='path-card'+(st.path===p.id?' active':'');
    c.innerHTML=`<div class="path-check"></div><div class="tag">${t(p.tag)}</div><h3>${t(p.name)}</h3><p>${t(p.desc)}</p>`;
    c.onclick=()=>{ st.path=p.id; st.sel={}; renderAll(); };
    el.appendChild(c);
  });
  $('franchiseToggle').style.display = st.path==='franquicia' ? 'flex' : 'none';
  document.querySelectorAll('#franchiseToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.owns===st.owns);
    b.onclick=()=>{ st.owns=b.dataset.owns; delete st.sel.matchingcon; renderAll(); };
  });
}
function core(id){ const x=IT[id]; return `<div class="item core"><div class="box"></div><div class="txt"><div class="name">${t(x.n)}</div>${x.d?`<div class="note">${t(x.d)}</div>`:''}</div><div class="tick">${t(UI.incl)}</div></div>`; }
function opt(id){
  const x=IT[id], on=!!st.sel[id];
  return `<div class="item opt${on?' checked':''}" data-id="${id}"><div class="box"></div><div class="txt"><div class="name">${t(x.n)}</div>${x.d?`<div class="note">${t(x.d)}</div>`:''}${x.nexo?`<div class="nexo-tag">${t(UI.nexo)}</div>`:''}</div></div>`;
}
function renderStages(){
  const p=st.path; if(!p){ $('afterPath').style.display='none'; return; }
  $('afterPath').style.display='block';
  let h='';
  h+=`<div class="stage-title">${t(UI.st1)}</div><div class="panel" style="margin-top:10px;">`;
  h+=`<div class="group-title">${t(UI.gCore)}</div>`+core('diag')+core('coord');
  const add=STARTER_ADDON[p];
  if(!(p==='franquicia' && st.owns!=='con')) h+=`<div class="group-title">${t(UI.gPath)}</div>`+opt(add);
  h+=`</div>`;
  h+=`<div class="stage-title">${t(UI.st2)}</div><div class="panel" style="margin-top:10px;">`;
  h+=`<div class="group-title">${t(UI.gStruct)}</div>`+opt(LAUNCH_FIRST[p]);
  h+=`<div class="group-title">${t(UI.gComp)}</div>`+LAUNCH_COMMON.map(opt).join('');
  h+=`</div>`;
  h+=`<div class="stage-title">${t(UI.st3)}</div><div class="panel" style="margin-top:10px;">`;
  h+=`<div class="group-title">${t(UI.gFixed)}</div>`+core('soporte')+core('conta')+core('nomina');
  h+=`<div class="group-title">${t(UI.gAfter)}</div>`+opt('retainer');
  h+=`</div>`;
  $('stagesList').innerHTML=h;
  document.querySelectorAll('#stagesList .item.opt').forEach(r=>{
    r.onclick=()=>{ const id=r.dataset.id; st.sel[id]=!st.sel[id]; r.classList.toggle('checked', st.sel[id]); };
  });
}
function renderPayment(){
  const el=$('paymentOptions');
  el.innerHTML=`
    <div class="payment-card${st.payment==='unico'?' active':''}" data-m="unico"><div class="pcheck"></div><div class="ptag">${t(UI.optA)}</div><h4>${t(UI.payA)}</h4><div class="pnote">${t(UI.payAnote)}</div></div>
    <div class="payment-card${st.payment==='cuotas'?' active':''}" data-m="cuotas"><div class="pcheck"></div><div class="ptag">${t(UI.optB)}</div><h4>${t(UI.payB)}</h4><div class="pnote">${t(UI.payBnote)}</div></div>`;
  el.querySelectorAll('.payment-card').forEach(c=>{ c.onclick=()=>{ st.payment=c.dataset.m; renderPayment(); }; });
}
function renderAll(){
  applyStatic();
  $('commonBox').classList.toggle('active', st.common);
  renderPaths(); renderStages(); renderPayment();
}
$('commonBox').onclick=()=>{ st.common=!st.common; $('commonBox').classList.toggle('active', st.common); };
$('langES').onclick=()=>{ L='es'; renderAll(); };
$('langEN').onclick=()=>{ L='en'; renderAll(); };

// ================= ENVÍO =================
$('clientSubmitBtn').onclick = async ()=>{
  const fn=$('fn').value.trim(), ln=$('ln').value.trim(), em=$('em').value.trim();
  if(!fn || !ln){ alert(t(UI.needName)); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ alert(t(UI.needEmail)); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(!st.path){ alert(t(UI.needPath)); return; }
  const btn=$('clientSubmitBtn'); btn.disabled=true; btn.textContent=t(UI.sending);
  const items = Object.keys(st.sel).filter(k=>st.sel[k] && k!=='retainer');
  try{
    const r = await fetch(CRM_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'cotizacion_solicitada', token:CRM_TOKEN, id:LEAD_ID,
        nombre: fn+' '+ln, email: em, idioma: L, whatsapp: params.get('whatsapp')||'', pais: params.get('pais')||'',
        path: st.path, owns: st.owns, common: st.common, items: items, retainer: !!st.sel.retainer,
        payment: st.payment || '', notas: $('clientNotes').value.trim()
      })
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'error');
    $('formArea').style.display='none'; $('doneBox').style.display='block'; window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    alert(t(UI.fail)); btn.disabled=false; btn.textContent=t(UI.send);
  }
};

// ================= ARRANQUE =================
(function prefill(){
  const nombre=(params.get('nombre')||'').trim();
  if(nombre){ const p=nombre.split(/\s+/); $('fn').value=p.shift()||''; $('ln').value=p.join(' '); }
  const email=(params.get('email')||'').trim(); if(email) $('em').value=email;
})();
renderAll();
</script>
</body>
</html>
